openapi: 3.1.0
info:
  title: Example API
  version: 1.0.0
servers:
  - url: https://api.example.com
    description: REST API
paths:
  /v1/hello:
    get:
      tags:
        - Hello
      description: |-
        Say hello.

        Returns a personalized greeting.
      operationId: HelloService_Hello
      parameters:
        - name: name
          in: query
          description: First name
          schema:
            type: string
            minLength: 1
            examples:
              - John
        - name: visibility
          in: query
          schema:
            $ref: '#/components/schemas/example.Visibility'
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/example.HelloResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
  /v1/{book.name}:
    patch:
      tags:
        - LibraryService
      operationId: LibraryService_UpdateBook
      parameters:
        - name: book.name
          in: path
          description: Resource name, `shelves/{shelf}/books/{book}`.
          required: true
          schema:
            type: string
            pattern: ^shelves/[^/]+/books/[^/]+$
        - name: updateMask
          in: query
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/example.Book'
        required: true
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/example.Book'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
  /v1/{name}:
    get:
      tags:
        - LibraryService
      description: Get a book.
      operationId: LibraryService_GetBook
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            pattern: ^shelves/[^/]+/books/[^/]+$
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/example.Book'
              example:
                name: shelves/1/books/2
                title: Dune
                authorEmail: frank@example.com
                pageCount: "412"
                tags:
                  - sci-fi
                  - classic
                visibility: VISIBILITY_PUBLIC
                createTime: "1965-08-01T00:00:00Z"
                rating: 4.8
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
    delete:
      tags:
        - LibraryService
      operationId: LibraryService_DeleteBook
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            pattern: ^shelves/[^/]+/books/[^/]+$
        - name: force
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                type: object
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      deprecated: true
  /v1/{name}/cover:
    put:
      tags:
        - LibraryService
      description: Upload the cover image of a book.
      operationId: LibraryService_UploadCover
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            pattern: ^shelves/[^/]+/books/[^/]+$
      requestBody:
        content:
          image/png:
            schema:
              type: string
              format: binary
        required: true
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                type: object
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
  /v1/{name}:archive:
    post:
      tags:
        - LibraryService
      operationId: LibraryService_ArchiveBook
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            pattern: ^shelves/[^/]+/books/[^/]+$
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
        required: true
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/example.Book'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
  /v1/{name}:delete:
    post:
      tags:
        - LibraryService
      operationId: LibraryService_DeleteBook_1
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            pattern: ^shelves/[^/]+/books/[^/]+$
        - name: force
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                type: object
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      deprecated: true
  /v1/{name}:export:
    get:
      tags:
        - LibraryService
      description: Export a book as CSV.
      operationId: LibraryService_ExportBook
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            pattern: ^shelves/[^/]+/books/[^/]+$
      responses:
        "200":
          description: A successful response.
          content:
            text/csv:
              schema:
                type: string
                format: binary
              example: |
                name,title,page_count
                shelves/1/books/2,Dune,412
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
  /v1/{parent}/books:
    get:
      tags:
        - LibraryService
      description: |-
        List books of a shelf, ordered by creation time
        with the most recent first.

        Use `page` to paginate.
      operationId: LibraryService_ListBooks
      parameters:
        - name: parent
          in: path
          required: true
          schema:
            type: string
            pattern: ^shelves/[^/]+$
        - name: page.pageSize
          in: query
          description: Maximum number of items to return.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            examples:
              - 20
        - name: page.pageToken
          in: query
          description: Token returned by a previous call.
          schema:
            type: string
        - name: visibility
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/example.Visibility'
        - name: updatedAfter
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/example.ListBooksResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
    post:
      tags:
        - LibraryService
      summary: Create a book
      description: |-
        Create a book in a shelf, its identifier is chosen
        by the client when `book_id` is set.
      operationId: createBook
      parameters:
        - name: parent
          in: path
          required: true
          schema:
            type: string
            pattern: ^shelves/[^/]+$
        - name: bookId
          in: query
          description: Client-assigned identifier.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/example.Book'
            example:
              title: Dune Messiah
              authorEmail: frank@example.com
              tags:
                - sci-fi
              visibility: VISIBILITY_PRIVATE
        required: true
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/example.Book'
              example:
                name: shelves/1/books/3
                title: Dune Messiah
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
      x-internal: false
      x-rate-limit: 10
components:
  schemas:
    example.ArchiveBookRequest:
      type: object
      properties:
        name:
          type: string
        reason:
          type: string
    example.Book:
      title: Book
      description: A book in a shelf.
      type: object
      properties:
        name:
          description: Resource name, `shelves/{shelf}/books/{book}`.
          type: string
        title:
          type: string
          maxLength: 256
        authorEmail:
          description: Contact email of the author.
          type: string
          format: email
        pageCount:
          type: string
          format: int64
          x-go-type: int
          x-order: 4
        sales:
          description: Number of sales, exposed as a JSON number.
          type: integer
          format: int64
        tags:
          type: array
          items:
            type: string
          maxItems: 10
        labels:
          type: object
          additionalProperties:
            type: string
        visibility:
          $ref: '#/components/schemas/example.Visibility'
        createTime:
          type: string
          format: date-time
          readOnly: true
        rating:
          type:
            - number
            - "null"
          format: double
        paperback:
          $ref: '#/components/schemas/example.Book.Paperback'
        ebookUrl:
          type: string
          format: uri
        tableOfContents:
          $ref: '#/components/schemas/example.Chapter'
        isbn:
          type: string
          deprecated: true
      required:
        - title
      examples:
        - name: shelves/1/books/2
          title: Dune
      x-resource:
        pattern: shelves/{shelf}/books/{book}
        type: library.example.com/Book
    example.Book.Paperback:
      type: object
      properties:
        weightGrams:
          type: integer
          format: int64
          minimum: 0
    example.Chapter:
      description: A recursive chapter tree.
      type: object
      properties:
        title:
          type: string
        sections:
          type: array
          items:
            $ref: '#/components/schemas/example.Chapter'
    example.CreateBookRequest:
      type: object
      properties:
        parent:
          type: string
        book:
          $ref: '#/components/schemas/example.Book'
        bookId:
          description: Client-assigned identifier.
          type: string
    example.DeleteBookRequest:
      type: object
      properties:
        name:
          type: string
        force:
          type: boolean
    example.ExportBookRequest:
      type: object
      properties:
        name:
          type: string
    example.GetBookRequest:
      type: object
      properties:
        name:
          type: string
    example.HelloRequest:
      type: object
      properties:
        name:
          description: First name
          type: string
          minLength: 1
          examples:
            - John
        visibility:
          $ref: '#/components/schemas/example.Visibility'
    example.HelloResponse:
      type: object
      properties:
        response:
          description: The greeting.
          type: string
    example.ListBooksRequest:
      type: object
      properties:
        parent:
          type: string
        page:
          $ref: '#/components/schemas/example.PageRequest'
        visibility:
          type: array
          items:
            $ref: '#/components/schemas/example.Visibility'
        updatedAfter:
          type: string
          format: date-time
    example.ListBooksResponse:
      type: object
      properties:
        books:
          type: array
          items:
            $ref: '#/components/schemas/example.Book'
        nextPageToken:
          type: string
    example.PageRequest:
      description: Pagination parameters shared by list endpoints.
      type: object
      properties:
        pageSize:
          description: Maximum number of items to return.
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          examples:
            - 20
        pageToken:
          description: Token returned by a previous call.
          type: string
    example.UpdateBookRequest:
      type: object
      properties:
        book:
          $ref: '#/components/schemas/example.Book'
        updateMask:
          type: string
    example.UploadCoverRequest:
      type: object
      properties:
        name:
          type: string
        cover:
          $ref: '#/components/schemas/google.api.HttpBody'
    example.Visibility:
      description: |-
        Visibility of a resource.
        - `VISIBILITY_PUBLIC`: Visible to everyone.
        - `VISIBILITY_PRIVATE`: Visible to the owner only.
      type: string
      enum:
        - VISIBILITY_UNSPECIFIED
        - VISIBILITY_PUBLIC
        - VISIBILITY_PRIVATE
    google.api.HttpBody:
      description: |-
        Message that represents an arbitrary HTTP body. It should only be used for
        payload formats that can't be represented as JSON, such as raw binary or
        an HTML page.


        This message can be used both in streaming and non-streaming API methods in
        the request as well as the response.

        It can be used as a top-level request field, which is convenient if one
        wants to extract parameters from either the URL or HTTP template into the
        request fields and also want access to the raw HTTP body.

        Example:

            message GetResourceRequest {
              // A unique request id.
              string request_id = 1;

              // The raw HTTP body is bound to this field.
              google.api.HttpBody http_body = 2;

            }

            service ResourceService {
              rpc GetResource(GetResourceRequest)
                returns (google.api.HttpBody);
              rpc UpdateResource(google.api.HttpBody)
                returns (google.protobuf.Empty);

            }

        Example with streaming methods:

            service CaldavService {
              rpc GetCalendar(stream google.api.HttpBody)
                returns (stream google.api.HttpBody);
              rpc UpdateCalendar(stream google.api.HttpBody)
                returns (stream google.api.HttpBody);

            }

        Use of this type only changes how the request and response bodies are
        handled, all other features will continue to work unchanged.
      type: object
      properties:
        contentType:
          description: The HTTP Content-Type header value specifying the content type of the body.
          type: string
        data:
          description: The HTTP request/response body as raw binary.
          type: string
          format: byte
        extensions:
          description: |-
            Application specific response metadata. Must be set in the first response
            for streaming APIs.
          type: array
          items:
            type: object
            properties:
              '@type':
                description: Type URL of the serialized message.
                type: string
            additionalProperties: {}
    google.rpc.Status:
      description: The `Status` type defines a logical error model, see https://google.aip.dev/193.
      type: object
      properties:
        code:
          description: The status code, which should be an enum value of google.rpc.Code.
          type: integer
          format: int32
        message:
          description: A developer-facing error message.
          type: string
        details:
          description: A list of messages that carry the error details.
          type: array
          items:
            type: object
            properties:
              '@type':
                description: Type URL of the serialized message.
                type: string
            additionalProperties: {}
tags:
  - name: Hello
    description: Greetings
  - name: LibraryService
