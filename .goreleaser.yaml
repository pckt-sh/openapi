version: 2

project_name: pckt-openapi

before:
  hooks:
    - go mod tidy -diff

builds:
  - id: protoc-gen-pckt-openapi
    main: ./cmd/protoc-gen-pckt-openapi
    binary: protoc-gen-pckt-openapi
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: [-s -w]
  - id: pckt-openapi-merge
    main: ./cmd/pckt-openapi-merge
    binary: pckt-openapi-merge
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: [-s -w]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  use: github
